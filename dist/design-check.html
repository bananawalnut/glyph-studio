<!doctype html><html lang="en"><meta charset="utf-8"><title>Glyph design checks</title><style>body{background:#080e10;color:#b5e6cf;font:12px monospace}iframe{width:1100px;height:900px;border:1px solid #29483c}pre{white-space:pre-wrap}</style><h1>Design-system browser checks</h1><pre id="result">RUNNING</pre><iframe id="gallery" title="Isolated gallery test"></iframe><script>
(async()=>{const output=document.querySelector('#result'),frame=document.querySelector('#gallery');const ok=(value,label)=>{if(!value)throw Error(label);output.textContent+='\nPASS '+label;};try{
const markup=await(await fetch('/design')).text(),mock=`<script>window.GLYPH_BRIDGE={token:'test-only'};{const originalFetch=window.fetch;window.designHarness={scene:null,flow:null,sceneRevision:0,flowRevision:0,posts:[],stale:false};window.fetch=async(url,options={})=>{const route=String(url),h=window.designHarness;if(!route.startsWith('/api/'))return originalFetch(url,options);if(!h.scene){h.scene=GlyphDesign.scene({object:'sphere',seed:93});h.flow=GlyphFlow.core.json(GlyphFlow.model.defaultDocument());}if(route==='/api/state')return new Response(JSON.stringify({scene:h.scene,revision:h.sceneRevision}));if(route==='/api/flow')return new Response(JSON.stringify({flow:h.flow,revision:h.flowRevision,calls:[]}));if(route==='/api/tool'){const body=JSON.parse(options.body);h.posts.push(body);if(h.stale)return new Response(JSON.stringify({error:{message:'Scene changed. Read the latest revision.'}}),{status:409});const a=body.arguments;if(body.name==='glyph_studio_apply'){GlyphScene.validate(a.scene);h.scene=a.scene;h.sceneRevision++;return new Response(JSON.stringify({revision:h.sceneRevision}));}if(body.name==='glyph_flow_edit'){const n=h.flow.components.find(n=>n.id===a.id),patch=JSON.parse(a.changes_json);if(patch.layout)Object.assign(n.layout,patch.layout);if(patch.spin!==undefined)n.spin=patch.spin;if(patch.methods)for(const [key,value] of Object.entries(patch.methods))Object.assign(n.methods[key],value);GlyphFlow.model.validate(h.flow);h.flowRevision++;return new Response(JSON.stringify({revision:h.flowRevision}));}}throw Error('Unexpected test route');};}<\/script>`;

d.querySelector('[data-view="tokens"]').click();ok(!$('foundations').hidden&&$('composition').hidden&&$('color-tokens').children.length===5,'foundations expose the shared renderer palette and tokens');d.querySelector('[data-view="objects"]').click();d.querySelector('[aria-label="Shell object"]').click();change('motion','flicker');ok($('material').value==='matrix'&&$('preview').scene.objects[0].glyphs.mode==='flicker','character animation selects a material with meaningful glyph variation');ok(w.designHarness.posts.length===4,'only explicit apply actions produced mutation requests');output.textContent+='\nALL DESIGN BROWSER CHECKS PASSED';document.title='PASS — Glyph design checks';
