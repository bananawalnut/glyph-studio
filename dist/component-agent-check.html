<!doctype html><meta charset="utf-8"><title>Component agent checks</title><script src="glyph-flow.js"></script><script src="glyph-agent.js"></script><h1>Component agent integration checks</h1><pre id="results"></pre><glyph-flow id="field" style="display:block;position:relative;width:720px;height:380px"><glyph-node id="source" aria-label="Source field" style="left:5%;top:10%;width:260px;height:280px"></glyph-node><glyph-node id="target" style="left:58%;top:10%;width:250px;height:280px"></glyph-node></glyph-flow><script>
(async()=>{const C=GlyphFlow.core,out=document.getElementById('results'),flow=document.getElementById('field'),source=document.getElementById('source'),target=document.getElementById('target'),d=new GlyphAgent.Directory({scope:'fixture'}),pass=s=>out.textContent+='PASS '+s+'\n',assert=(v,s)=>{if(!v)throw Error(s);};
const list={type:'array',items:{type:'string',maxLength:20},maxItems:8},definition=()=>({interface:new GlyphFlow.ComponentInterface({description:'A spherical word array.',state:list,methods:{add:{description:'Append one word and return it after animated arrival.',input:{type:'string',maxLength:20},output:{type:'string',maxLength:20},interaction:{travel:'hop',receive:'pixel-sort',duration:.1},handle:(state,word)=>({state:[...state,word],result:word})}}}),initial:['SHELL'],organize:(state)=>state.map((label,i)=>({id:String(i),label,x:110,y:100+i*15,z:0}))});
try{source.definition=definition();target.definition=definition();flow.setAttribute('paused','');
for(const node of [source,target])d.register(node.id,{element:node,describe:()=>({name:node.id,interface:node.describe(),revision:node.revision,interfaceRevision:node.interfaceRevision}),read:()=>node.value,invoke:async(method,payload,{requestId,signal})=>{const abort=()=>flow.cancel(requestId);signal?.addEventListener('abort',abort,{once:true});try{const r=await node.invoke(method,payload,{id:requestId});return {result:r.result,transport:r};}finally{signal?.removeEventListener('abort',abort);}}});
const a=d.discover().components[0];assert(a.index===0&&a.locator.includes('data-glyph-agent-address'),'DOM identity');assert(document.querySelector(a.locator)===source,'locator');assert(!('state' in a),'state opt-in');pass('real DOM discovery, browser-local index, semantic interface, address and locator');
const req={address:a.address,handle:a.handle,method:'add',payload:'AGENT',requestId:'agent-add',expectedRevision:0},promise=d.invoke(req);assert(d.invoke(req)===promise,'duplicate promise');await Promise.resolve();assert(source.value.length===1,'no precommit');pass('agent call does not commit before receiver arrival');
let time=0;while(flow.flights.size&&time<20000){time+=16;flow.advance(time);}const receipt=await promise;assert(receipt.result==='AGENT'&&source.value.length===2&&receipt.transport.status==='arrived','receipt');assert((await d.invoke(req)).result==='AGENT'&&source.value.length===2,'replay');pass('animated invocation returns typed receipt; duplicate request does not append twice');
source.definition=definition();let rejected=false;try{await d.invoke({...req,requestId:'stale'});}catch(e){rejected=e.code==='stale_handle';}assert(rejected,'old handle must reject');pass('definition replacement invalidates old handles');
const fresh=d.describe(a.address),cancel=new AbortController(),pending=d.invoke({...req,handle:fresh.handle,expectedRevision:0,requestId:'cancel-flight'},{signal:cancel.signal});await Promise.resolve();cancel.abort();try{await pending;}catch{}assert(source.value.length===1&&!flow.flights.size,'abort rollback');pass('aborted travel cancels before state commit');
source.remove();assert(d.discover().components.length===1,'disconnect removes endpoint');pass('disconnect removes component from discovery');out.textContent+='ALL PASSED';
}catch(e){out.textContent+='FAIL '+e.message;}finally{d.destroy();}
})();
</script>
