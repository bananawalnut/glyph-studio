<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Animal renderer checks</title><script defer src="betta-geometry.js"></script><script defer src="life-geometry.js"></script><script defer src="life-motion.js"></script><script defer src="life-player.js"></script><style>body{margin:24px;background:#100c16;color:#d9c2e0;font:13px/1.6 monospace}glyph-animal{width:600px;max-width:100%;height:400px}pre{white-space:pre-wrap}</style></head><body><h1>Animal renderer checks</h1><pre id="result" role="status">Running…</pre><glyph-animal species="sea-angel" paused></glyph-animal><script>
window.addEventListener('load',async()=>{const out=document.getElementById('result'),el=document.querySelector('glyph-animal'),records=[];const check=(ok,label)=>{if(!ok)throw Error(label);records.push('PASS '+label);out.textContent=records.join('\n');};try{
check(el.dataset.renderer==='webgl2','WebGL2 renderer initialized');const g=el.gl,vs=g.createShader(g.VERTEX_SHADER),fs=g.createShader(g.FRAGMENT_SHADER);g.shaderSource(vs,`#version 300 es
precision highp float;layout(location=0) in vec3 p;layout(location=3) in vec4 behavior;layout(location=4) in vec3 meta;uniform float u_phase;const float T=6.283185307179586;out vec3 v_position;
${AnimalMotion.GLSL}
void main(){v_position=animalDeform(p,behavior.x,behavior.y,meta.y,meta.x);gl_Position=vec4(0.);}`);g.shaderSource(fs,'#version 300 es\nprecision highp float;out vec4 color;void main(){color=vec4(0.);}');g.compileShader(vs);g.compileShader(fs);const program=g.createProgram();g.attachShader(program,vs);g.attachShader(program,fs);g.transformFeedbackVaryings(program,['v_position'],g.INTERLEAVED_ATTRIBS);g.linkProgram(program);check(g.getProgramParameter(program,g.LINK_STATUS),'GPU deformation program linked');
const vao=g.createVertexArray(),input=g.createBuffer(),output=g.createBuffer(),tf=g.createTransformFeedback(),phase=g.getUniformLocation(program,'u_phase');let worst=0,compared=0;
for(const id of AnimalGeometry.SPECIES){const m=AnimalGeometry.generate(id);g.bindVertexArray(vao);g.bindBuffer(g.ARRAY_BUFFER,input);g.bufferData(g.ARRAY_BUFFER,m.data,g.STATIC_DRAW);for(const [i,n,offset] of [[0,3,0],[3,4,9],[4,3,13]]){g.enableVertexAttribArray(i);g.vertexAttribPointer(i,n,g.FLOAT,false,64,offset*4);}g.bindTransformFeedback(g.TRANSFORM_FEEDBACK,tf);g.bindBufferBase(g.TRANSFORM_FEEDBACK_BUFFER,0,output);g.bufferData(g.TRANSFORM_FEEDBACK_BUFFER,m.count*12,g.DYNAMIC_READ);const positions=new Float32Array(m.count*3);
for(const t of [0,.117,.217,1]){g.useProgram(program);g.uniform1f(phase,t);g.enable(g.RASTERIZER_DISCARD);g.beginTransformFeedback(g.POINTS);g.drawArrays(g.POINTS,0,m.count);g.endTransformFeedback();g.disable(g.RASTERIZER_DISCARD);g.bindBuffer(g.TRANSFORM_FEEDBACK_BUFFER,output);g.getBufferSubData(g.TRANSFORM_FEEDBACK_BUFFER,0,positions);for(let i=0;i<m.count;i+=17){const cpu=AnimalMotion.deform(m.data.subarray(i*16,i*16+16),t);for(let k=0;k<3;k++){const error=Math.abs(cpu[k]-positions[i*3+k]);if(!Number.isFinite(error))throw Error(id+' non-finite GPU position');worst=Math.max(worst,error);compared++;}}}
check(worst<.0002,id+' GPU/CPU kinematic agreement');}
g.bindTransformFeedback(g.TRANSFORM_FEEDBACK,null);g.bindBufferBase(g.TRANSFORM_FEEDBACK_BUFFER,0,null);g.deleteTransformFeedback(tf);g.deleteBuffer(input);g.deleteBuffer(output);g.deleteVertexArray(vao);g.deleteProgram(program);g.deleteShader(vs);g.deleteShader(fs);
for(const id of AnimalGeometry.SPECIES){el.setAttribute('species',id);el._frame=0;el.draw();const a=new Uint8Array(el.canvas.width*el.canvas.height*4);g.readPixels(0,0,el.canvas.width,el.canvas.height,g.RGBA,g.UNSIGNED_BYTE,a);el._frame=720;el.draw();const b=new Uint8Array(a.length);g.readPixels(0,0,el.canvas.width,el.canvas.height,g.RGBA,g.UNSIGNED_BYTE,b);let sum=0,light=0;for(let i=0;i<a.length;i++){sum+=Math.abs(a[i]-b[i]);light+=a[i];}check(light>1000&&sum/a.length<.04,id+' visible render and pixel loop closure');}
el.setAttribute('detail','1.35');check(Number(el.dataset.glyphs)>3000,'fine geometry change');check(el.saveFrame().startsWith('data:image/png;base64,'),'PNG export');const parent=el.parentNode;el.remove();check(!el._ready&&!el._raf,'disconnect cancels animation');parent.append(el);check(el._ready&&el.dataset.renderer==='webgl2','reconnect rebuilds renderer');el.draw();check(el.gl.getError()===el.gl.NO_ERROR,'no WebGL errors after reconnect');
const ext=el.gl.getExtension('WEBGL_lose_context');if(ext){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Context restoration timed out')),5000);el.canvas.addEventListener('webglcontextrestored',()=>{clearTimeout(timer);resolve();},{once:true});el.canvas.addEventListener('webglcontextlost',()=>setTimeout(()=>ext.restoreContext(),500),{once:true});ext.loseContext();});el.draw();check(!el._lost&&el.gl.getError()===el.gl.NO_ERROR,'context loss and recovery');}
records.push('COMPLETE — '+compared+' coordinates; maximum GPU error '+worst.toExponential(3));out.textContent=records.join('\n');document.body.dataset.result='passed';
}catch(e){out.textContent=records.join('\n')+'\nFAIL '+e.message;document.body.dataset.result='failed';console.error(e);}});
</script></body></html>
