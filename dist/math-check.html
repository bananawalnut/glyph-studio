(async()=>{const out=document.querySelector('#result'),frame=document.querySelector('#lab'),ok=(v,label)=>{if(!v)throw Error(label);out.textContent+='\nPASS '+label;},wait=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>6000)throw Error('UI did not settle');await new Promise(r=>setTimeout(r,20));}};try{const markup=await(await fetch('/math')).text(),ready=new Promise(r=>frame.onload=r);frame.srcdoc=markup.replace('<head>','<head><base href="/">').replace(/<script>window.GLYPH_BRIDGE=.*?<\/script>/,'');await ready;const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),stage=$('math-stage'),flow=$('logic-stage'),node=$('sculpture');await wait(()=>stage.engine&&node.value);stage.pause();ok(stage.engine.kind==='webgl2','program uses the real WebGL2 renderer');ok(stage.stats.instances===1950&&stage.stats.drawCalls===3,'authored shell, mapped path and independent antenna compile to three instance buffers');const pixels=new Uint8Array(stage.canvas.width*stage.canvas.height*4);stage.draw();stage.engine.gl.readPixels(0,0,stage.canvas.width,stage.canvas.height,stage.engine.gl.RGBA,stage.engine.gl.UNSIGNED_BYTE,pixels);ok(pixels.some((x,i)=>i%4===3&&x>0),'GPU shader paints actual custom geometry');const gpuBuffer=stage.engine.layers[0].buffer,atlas=stage.engine.atlas.texture;const before=Array.from(stage.engine.layers[0].data);stage.seek(30);ok(stage.engine.layers[0].buffer===gpuBuffer&&stage.engine.atlas.texture===atlas,'frame updates reuse GPU buffers and the glyph atlas');ok(before.some((x,i)=>Math.abs(x-stage.engine.layers[0].data[i])>1e-6),'seek evaluates arbitrary time-dependent math');const program=stage.program,frameBefore=stage.frame;stage.params={amplitude:.5};ok(stage.frame===frameBefore&&stage.program===program,'param updates preserve the program and playback frame');const validBuffer=stage.engine.layers[0].data.slice();try{stage.params={amplitude:NaN};}catch{}ok(stage.params.amplitude===.5&&validBuffer.every((x,i)=>x===stage.engine.layers[0].data[i]),'invalid params leave the last valid geometry intact');$('attached').click();ok($('logic-status').textContent.includes('Native HTML button'),'native HTML remains clickable on an exact parametric surface point');ok(stage.getAttribute('role')==='group','interactive content is exposed as a group rather than flattened into an image');ok($('attached').parentElement.style.visibility==='visible','surface attachment resolves through nested transforms');
for(const name of ['knot','ribbon','harmonic']){$('example').value=name;$('example').dispatchEvent(new Event('change',{bubbles:true}));ok(stage.program.entries.length>0&&stage.stats.instances>0,'authored '+name+' program renders');}
flow.setAttribute('paused','');const old=node.value.amplitude,receipt=flow.invoke({to:'sculpture',method:'sculpt',payload:.6,origin:{x:-20,y:150},id:'math-test-call'});ok(node.value.amplitude===old&&flow.flights.size===1,'custom method preserves state until receiving');flow.last=0;for(let i=1;i<2500&&flow.flights.size;i++)flow.advance(i*1000/120);const result=await receipt;ok(result.result===.6&&node.value.amplitude===.6&&stage.params.amplitude===.6,'typed custom handler result deforms the program after arrival');ok(node._definition.motion.type==='custom','receiving layout uses an application-authored 3D transition');flow.advance(30000);flow.advance(31000);ok(!d.querySelector('#error').textContent,'geometry and custom transition complete without errors');
const canvas=d.createElement('glyph-program');canvas.setAttribute('renderer','canvas');canvas.setAttribute('paused','');canvas.style.cssText='width:300px;height:300px';d.body.append(canvas);canvas.program=w.GlyphMathExamples.make('ribbon');ok(canvas.stats.renderer==='canvas'&&canvas.stats.instances>0,'custom geometry also renders through Canvas fallback');const data=canvas.engine.layers[0].data.slice();canvas.remove();ok(canvas.engine===null,'disconnect releases graphics resources');d.body.append(canvas);ok(canvas.engine&&canvas.engine.layers[0].data.every((x,i)=>x===data[i]),'reconnect restores the authored geometry');
stage.setAttribute('geometry','wasm');ok(stage.dataset.geometry==='program'&&stage.stats.geometry==='program','program does not accidentally opt into the built-in recipe compiler');stage.removeAttribute('geometry');const engine=stage.engine,ext=engine.gl.getExtension('WEBGL_lose_context');if(ext){ext.loseContext();await wait(()=>engine.lost);ext.restoreContext();await wait(()=>!engine.lost);stage.draw();ok(stage.engine.layers.length===3&&stage.engine.gl.getError()===0,'WebGL context restoration retains custom buffers');}
const badMotion=w.GlyphFlow.core.motion({type:'custom',duration:1,sample:()=>({x:NaN,y:0,z:0})});node.reorganize(node._definition.organize,badMotion);let errors=0;flow.addEventListener('glyph-flow-error',()=>errors++);node._transition.old=new Map(node._marks.map(m=>[m.id,{...m,x:m.x-20}]));flow.time+=.2;flow.paint();await Promise.resolve();ok(errors===1&&node._transition===null,'invalid transition emits one error and settles safely');out.textContent+='\nALL MATH BROWSER CHECKS PASSED';document.title='PASS — Math framework checks';}catch(e){out.textContent+='\nFAIL '+e.stack;document.title='FAIL — Math framework checks';}})();
