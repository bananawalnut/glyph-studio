<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENITH — Open consultancy / Shell & Signal</title>
<style>
:root{color-scheme:dark;--ink:#080c0d;--cyan:#86d6ee;--dim:#7b898a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#dce3e1;font:11px var(--mono)}.plate{max-width:800px;margin:0 auto;padding:20px 22px}.identity{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:8px}h1{margin:0;font:400 11px/1.5 var(--mono);letter-spacing:1.5px;color:var(--cyan)}.identity>span{font-size:9px;letter-spacing:1px;color:var(--dim)}.picture{max-width:720px;margin:auto}canvas{display:block;width:100%;aspect-ratio:1;height:auto}.transport{display:flex;gap:12px;align-items:center;max-width:720px;margin:8px auto 0;color:var(--dim);font-size:9px}.transport input{accent-color:var(--cyan);width:130px;min-width:0}.transport button{border:1px solid #243033;border-radius:0;padding:8px 10px;background:transparent;color:#c7d5d7;font:9px var(--mono);cursor:pointer}.transport button:hover{border-color:var(--cyan);color:var(--cyan)}.transport button:last-child{margin-left:auto}.transport output{white-space:nowrap}.transport button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
.agent{max-width:720px;margin:24px auto 12px;padding-top:18px;border-top:1px solid #1c292b}.agent header{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:9px;line-height:1.7}.agent label{color:var(--cyan);letter-spacing:1px}.agent textarea{display:block;resize:vertical;width:100%;min-height:68px;margin:12px 0 8px;border:1px solid #243033;background:#0b1113;color:#dce3e1;padding:12px;font:11px/1.6 var(--mono)}.agent textarea:focus{outline:1px solid var(--cyan)}.agent .actions{display:flex;align-items:center;gap:10px}.agent button{background:transparent;border:1px solid #304348;color:var(--cyan);padding:9px 12px;font:10px var(--mono);cursor:pointer}.agent button:disabled{opacity:.4;cursor:default}.agent #agent-stop{color:var(--dim)}.agent #agent-undo{margin-left:auto}.agent p{font:10px/1.7 var(--mono);color:var(--dim);white-space:pre-wrap;margin:12px 0 0}.agent [hidden]{display:none}.agent #agent-result{color:#b9cdd1}.agent small{font-size:9px;color:var(--dim)}
@media(max-width:500px){.plate{padding:18px 12px}.identity{gap:8px}h1{font-size:9px;letter-spacing:.5px}.identity>span{font-size:8px}.transport{gap:8px;flex-wrap:wrap}.transport input{width:80px}.transport button{min-height:44px}.transport output{font-size:8px}}
</style>
<script defer src="scene.js"></script>
</head>
<body><main class="plate">
 <header class="identity"><h1>ZENITH / OPEN CONSULTANCY</h1><span>SHELL + SIGNAL</span></header>
 <div class="picture"><canvas id="zenith-canvas" role="img" aria-label="A sparse, dim sphere of small crosses, with a thin cyan ZENITH / OPEN CONSULTANCY text ring. Shell and signal rotate independently in opposite directions."></canvas></div>
 <div class="transport"><button id="zenith-play" aria-pressed="true">Pause</button><label class="sr" for="zenith-frame">Animation frame</label><input id="zenith-frame" type="range" min="0" max="479" value="24" step="1"><output id="zenith-time">00.80 / 16s</output><button id="zenith-export">Scene recipe ↓</button></div>
 <section class="agent" aria-label="Local Hermes designer">
  <header><label for="agent-prompt">PROMPT / HERMES</label><span id="agent-model">Connecting…</span></header>
  <form id="agent-form"><textarea id="agent-prompt" maxlength="6000" placeholder="Make the shell a little brighter. Keep the signal thin and cyan." required></textarea>
   <div class="actions"><button id="agent-send" type="submit" disabled>Apply change ↗</button><button id="agent-stop" type="button" hidden>Stop</button><small id="agent-status" role="status" aria-live="polite">Checking local agent…</small><button id="agent-undo" type="button" disabled>Undo</button></div>
  </form><p id="agent-result" aria-live="polite"></p>
 </section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const E=GlyphScene,canvas=document.getElementById('zenith-canvas'),play=document.getElementById('zenith-play'),slider=document.getElementById('zenith-frame'),time=document.getElementById('zenith-time');
 let scene=E.compile(E.ZENITH_EXAMPLE).scene,frame=24,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,origin=24,start=performance.now(),last=-1,revision=-1,viewRevision=-1;
 const total=()=>Math.round(scene.duration*scene.fps);
 function draw(){E.render(canvas,scene,frame/total());slider.max=total()-1;slider.value=frame;time.value=(frame/scene.fps).toFixed(2).padStart(5,'0')+' / '+scene.duration+'s';last=frame;}
 function label(){play.textContent=playing?'Pause':'Play';play.setAttribute('aria-pressed',String(playing));}
 const auth=window.GLYPH_BRIDGE;
 async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+auth.token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Local connection failed');return d;}
 async function publishView(){if(!auth)return;try{await api('tool',{name:'glyph_studio_preview',arguments:{frame,playing,expected_revision:revision}});}catch(e){document.getElementById('agent-status').textContent=e.message;}}
 new ResizeObserver(()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw();}).observe(canvas);
 play.onclick=()=>{playing=!playing;origin=frame;start=performance.now();label();publishView();};
 slider.oninput=()=>{playing=false;frame=+slider.value;label();draw();};slider.onchange=publishView;
 document.getElementById('zenith-export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(scene,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='zenith-open-consultancy.scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 function tick(now){if(playing&&!document.hidden){frame=(origin+Math.floor((now-start)*scene.fps/1000))%total();if(frame!==last)draw();}requestAnimationFrame(tick);}
 document.addEventListener('visibilitychange',()=>{origin=frame;start=performance.now();});label();requestAnimationFrame(tick);
 const form=document.getElementById('agent-form'),prompt=document.getElementById('agent-prompt'),send=document.getElementById('agent-send'),stop=document.getElementById('agent-stop'),undo=document.getElementById('agent-undo'),status=document.getElementById('agent-status'),response=document.getElementById('agent-result'),model=document.getElementById('agent-model');
 let busy=false,polling=false;
 function agentState(d){busy=d.job?.status==='running';send.disabled=!d.connected||busy;stop.hidden=!busy;undo.disabled=!d.canUndo||busy;model.textContent=d.connected?'ON-DEVICE / '+d.modelLabel:'OFFLINE';const stages={glyph_studio_read:'Reading scene…',glyph_studio_update:'Updating layer…',glyph_studio_apply:'Applying scene…',glyph_studio_compile:'Checking recipe…',glyph_studio_add:'Adding layer…',glyph_studio_remove:'Removing layer…',glyph_studio_preview:'Checking playback…'};status.textContent=busy?(stages[d.job.stage]||d.job.stage):d.job?.status==='complete'?'Complete':d.job?.status==='undone'?'Undone':d.job?.status==='failed'?'Needs attention':d.job?.status==='cancelled'?'Stopped':d.connected?'Ready':'Start Hermes to connect';if(d.job?.message)response.textContent=d.job.message;}
 async function poll(){if(polling||!auth)return;polling=true;try{const [s,a]=await Promise.all([api('state'),api('agent')]);if(s.revision!==revision||s.view.revision!==viewRevision){E.validate(s.scene);scene=s.scene;revision=s.revision;viewRevision=s.view.revision;frame=s.view.frame;playing=s.view.playing;origin=frame;start=performance.now();label();draw();}agentState(a);}catch(e){send.disabled=true;status.textContent='Disconnected';response.textContent=e.message;}finally{polling=false;}}
 form.onsubmit=async e=>{e.preventDefault();if(busy||!auth)return;send.disabled=true;response.textContent='';try{agentState(await api('agent',{prompt:prompt.value}));}catch(e){response.textContent=e.message;send.disabled=false;}};
 stop.onclick=async()=>{try{agentState(await api('agent/cancel',{}));}catch(e){response.textContent=e.message;}};
 undo.onclick=async()=>{undo.disabled=true;try{await api('agent/undo',{});await poll();response.textContent='Restored the scene from before your last prompt.';}catch(e){response.textContent=e.message;}};
 prompt.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();form.requestSubmit();}};
 if(auth){poll();setInterval(poll,700);}else{model.textContent='STANDALONE';status.textContent='Open the local tool to prompt changes';response.textContent='Start hermes/start.py, then open http://127.0.0.1:8788/zenith to attach the local agent.';}

});
</script></body></html>
